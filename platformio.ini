; TraceQ Arduino 2.1 — PlatformIO Project Configuration
;
; 1.0(=1.4.1)과 동일하게 megaatmega2560을 타겟으로 하며, MFRC522는 1.0과 같은
; miguelbalboa/rfid 1.2.0 을 **프로젝트 안(lib\MFRC522\)에 복사해** 사용한다.
; 원본 1.2.0 의 SPI 클럭 버그(실동작 125 kHz)를 고쳐야 해서 벤더링했다 —
; 자세한 경위는 lib\MFRC522\MFRC522.cpp 머리말 참조.
;
; ★lib_deps 로 받지 않으므로, 과거에 받아 둔 `.pio\libdeps\...\MFRC522` 가 남아
;  있으면 LDF 가 그쪽을 먼저 쓴다(실제로 겪음). 벤더 사본이 안 먹으면
;  `.pio\libdeps\megaatmega2560\MFRC522` 를 지우고 다시 빌드할 것.
;
; 빌드 플래그:
;   - SERIAL_RX_BUFFER_SIZE는 1.0과 동일하게 512 (통짜 단일 write 수신 전제).
;   - TRACEQ_RFID_VERIFY_WRITES=1: 쓰기 후 read-back 검증을 활성화.
;   - TRACEQ_RFID_MAX_WRITE_RETRIES=3: 쓰기 실패 시 재시도 횟수.
;   - MFRC522_SPICLOCK: RC522 SPI 클럭(Hz). 배선 품질에 따라 단계적으로 조정.

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

build_flags =
    -D SERIAL_RX_BUFFER_SIZE=512
    -D TRACEQ_RFID_VERIFY_WRITES=1
    -D TRACEQ_RFID_MAX_WRITE_RETRIES=3
    ; RC522 SPI 클럭(Hz). 배선(듀폰 점퍼·긴 선)이 나쁘면 CRC 오류가 나므로
    ; 1_000_000 → 4_000_000 순으로 실기 확인하며 올릴 것. 문제가 생기면 되돌린다.
    ; (칩 자체는 10 MHz 까지 규격이나 브레드보드 배선에서는 4 MHz 이하 권장)
    -D MFRC522_SPICLOCK=1000000UL

monitor_speed = 115200
monitor_filters = log2file, default

lib_deps =
    bblanchon/ArduinoJson@^6.19.4
    adafruit/RTClib@^2.1.1
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    ; MFRC522 는 lib\MFRC522\ 의 **벤더 사본**(1.2.0 + SPI 클럭 버그 패치)을 쓴다.
    ; 프로젝트 lib/ 가 lib_deps 보다 우선하므로 여기서 받지 않는다.
    ; (원본 1.2.0 은 SPISettings 클럭 자리에 divider 상수를 넘겨 실동작이
    ;  125 kHz 였다 — 보드 레지스터 실측으로 확정. lib\MFRC522\MFRC522.cpp 머리말 참조)

; ── 진단용 (일회성) — SPI 실속도·타이머 레지스터·구간별 소요시간 측정 ──
;    사용: py -m platformio run -e probe -t upload --upload-port COMx
;    측정이 끝나면 반드시 기본 env 를 다시 업로드할 것.
[env:probe]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = -<*> +<../examples/RegisterProbe/>
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=512
    -D TRACEQ_RFID_VERIFY_WRITES=1
    -D TRACEQ_RFID_MAX_WRITE_RETRIES=3
    -D MFRC522_SPICLOCK=1000000UL
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.19.4
    adafruit/RTClib@^2.1.1
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    ; MFRC522 = lib\MFRC522\ 벤더 사본 (기본 env 와 동일)

; ── 무결성 검사 (일회성) — SPI 속도별 읽기/쓰기 오류율 실측 ──
;    SPI 속도를 바꿔가며 반복: -D MFRC522_SPICLOCK=<Hz> 만 수정 후 재업로드.
;    쓰기는 스크래치 블록(52)에만 하고 끝에 0 으로 복구한다.
[env:integrity]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = -<*> +<../examples/IntegrityTest/>
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=512
    -D TRACEQ_RFID_VERIFY_WRITES=1
    -D TRACEQ_RFID_MAX_WRITE_RETRIES=3
    -D MFRC522_SPICLOCK=1000000UL
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.19.4
    adafruit/RTClib@^2.1.1
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
