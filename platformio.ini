; TraceQ Arduino 2.1 — PlatformIO Project Configuration
;
; 1.0(=1.4.1)과 동일하게 megaatmega2560을 타겟으로 하며, MFRC522는 1.0과 같은
; miguelbalboa/rfid 1.2.0을 GitHub 태그로 고정해 사용한다.
;
; 빌드 플래그:
;   - SERIAL_RX_BUFFER_SIZE는 1.0과 동일하게 512 (통짜 단일 write 수신 전제).
;   - TRACEQ_RFID_VERIFY_WRITES=1: 쓰기 후 read-back 검증을 활성화.
;   - TRACEQ_RFID_MAX_WRITE_RETRIES=3: 쓰기 실패 시 재시도 횟수.
;
; 참고: 2.0에 있던 `-D MFRC522_SPICLOCK=8000000UL`은 제거했다. MFRC522 1.2.0에는
; 그 매크로가 존재하지 않아(라이브러리는 SPISettings(SPI_CLOCK_DIV4,...)로 고정)
; 아무 효과가 없었다. SPI 실속도 변경은 라이브러리 수정 + 실기 검증이 필요한
; 별도 작업이다.

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

build_flags =
    -D SERIAL_RX_BUFFER_SIZE=512
    -D TRACEQ_RFID_VERIFY_WRITES=1
    -D TRACEQ_RFID_MAX_WRITE_RETRIES=3

monitor_speed = 115200
monitor_filters = log2file, default

lib_deps =
    bblanchon/ArduinoJson@^6.19.4
    adafruit/RTClib@^2.1.1
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    ; MFRC522 1.2.0 — 1.0이 사용한 것과 동일 버전을 GitHub 태그에서 직접 가져온다.
    ; 레지스트리의 최신 버전을 쓰면 RfidController에서 알 수 없는 오류가 재현되므로
    ; 반드시 1.2.0 태그로 고정.
    https://github.com/miguelbalboa/rfid.git#1.2.0
